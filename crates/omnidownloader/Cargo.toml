[package]
name = "omnidownloader"
version = "0.2.0"
edition = "2021"
description = "A terminal-first download manager with a persistent queue"
license = "MIT"
repository = "https://github.com/ASVLCII/OmniDownloader"
readme = "../../README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "6"
fs2 = "0.4"
futures-util = "0.3"
interprocess = { version = "2.4", features = ["tokio"] }
ratatui = "0.29"
reqwest = { version = "0.12", features = ["stream", "json", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
which = "7"
widestring = "1"

[target.'cfg(windows)'.dependencies]
rusqlite = "0.32"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_JobObjects"] }

[target.'cfg(not(windows))'.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
